{% extends "base.html" %}

{% block title %}Регистрация — Байкал-центр{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-10 col-md-8 col-lg-6">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="auth-icon">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2 class="auth-title">Регистрация</h2>
                        <p class="auth-subtitle">Создайте аккаунт для бронирования номеров</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}" class="auth-form" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="form-group">
                            <label for="name" class="form-label">
                                <i class="fas fa-user"></i> Ваше имя
                            </label>
                            <input type="text" 
                                   id="name" 
                                   name="name" 
                                   class="form-control" 
                                   placeholder="Иван Иванов"
                                   value="{{ request.form.get('name', '') }}">
                        </div>

                        <div class="form-group">
                            <label for="email" class="form-label">
                                <i class="fas fa-envelope"></i> Электронная почта
                                <span class="required-star">*</span>
                            </label>
                            <input type="email" 
                                   id="email" 
                                   name="email" 
                                   class="form-control" 
                                   placeholder="ivan@example.com"
                                   value="{{ request.form.get('email', '') }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="phone" class="form-label">
                                <i class="fas fa-phone"></i> Номер телефона
                                <span class="required-star">*</span>
                            </label>
                            <input type="tel" 
                                   id="phone" 
                                   name="phone" 
                                   class="form-control" 
                                   placeholder="+7 (924) 123-45-67"
                                   value="{{ request.form.get('phone', '') }}"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Пароль
                                <span class="required-star">*</span>
                            </label>
                            <input type="password" 
                                   id="password" 
                                   name="password" 
                                   class="form-control" 
                                   placeholder="Минимум 6 символов"
                                   required>
                            <div class="form-text">Пароль должен содержать минимум 6 символов.</div>
                        </div>

                        <div class="form-group">
                            <label for="confirm_password" class="form-label">
                                <i class="fas fa-check-circle"></i> Подтверждение пароля
                                <span class="required-star">*</span>
                            </label>
                            <input type="password" 
                                   id="confirm_password" 
                                   name="confirm_password" 
                                   class="form-control" 
                                   placeholder="Повторите пароль"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-gold btn-block">
                            <i class="fas fa-user-plus me-2"></i> Зарегистрироваться
                        </button>

                        <div class="auth-footer">
                            <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .auth-section {
        padding: 40px 0 60px;
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        background: linear-gradient(135deg, #f5f7f6 0%, #e8ece9 100%);
    }

    .auth-card {
        background: var(--white);
        border-radius: 20px;
        padding: 32px 28px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(212, 175, 55, 0.1);
        transition: all 0.3s ease;
        width: 100%;
    }

    .auth-header {
        text-align: center;
        margin-bottom: 24px;
    }

    .auth-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
        color: var(--primary-dark);
        font-size: 1.5rem;
    }

    .auth-title {
        font-family: 'Raleway', sans-serif;
        font-weight: 700;
        color: var(--primary-dark);
        font-size: 1.6rem;
        margin-bottom: 4px;
    }

    .auth-subtitle {
        color: var(--gray);
        font-size: 0.9rem;
        margin-bottom: 0;
    }

    .auth-form .form-group {
        margin-bottom: 16px;
    }

    .form-label {
        font-weight: 600;
        color: var(--primary-dark);
        font-size: 0.8rem;
        letter-spacing: 0.3px;
        margin-bottom: 5px;
        display: block;
    }

    .form-label i {
        color: var(--gold);
        width: 18px;
        font-size: 0.85rem;
    }

    .required-star {
        color: #dc3545;
        margin-left: 2px;
    }

    .form-control {
        border: 2px solid rgba(11, 59, 59, 0.08);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.9rem;
        transition: all 0.3s;
        background: var(--white);
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
    }

    .form-control:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.08);
        outline: none;
    }

    .form-control.is-invalid {
        border-color: #dc3545;
    }

    .form-control.is-invalid:focus {
        box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
    }

    .form-text {
        font-size: 0.7rem;
        color: var(--gray);
        margin-top: 3px;
    }

    .btn-gold {
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
        background-size: 200% 200%;
        color: var(--dark);
        border: none;
        padding: 12px 24px;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        border-radius: 50px;
        transition: all 0.4s ease;
        animation: goldShimmer 3s ease infinite;
        width: 100%;
        cursor: pointer;
    }

    .btn-gold:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
        color: var(--dark);
    }

    .btn-gold:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
    }

    @keyframes goldShimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .auth-footer {
        text-align: center;
        margin-top: 18px;
        font-size: 0.85rem;
        color: var(--gray);
    }

    .auth-footer a {
        color: var(--gold);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
    }

    .auth-footer a:hover {
        color: var(--gold-dark);
        text-decoration: underline;
    }

    /* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
    @media (max-width: 768px) {
        .auth-section {
            padding: 30px 0 40px;
            min-height: calc(100vh - 140px);
        }

        .auth-card {
            padding: 24px 18px;
            border-radius: 16px;
        }

        .auth-title {
            font-size: 1.3rem;
        }

        .auth-subtitle {
            font-size: 0.8rem;
        }

        .auth-icon {
            width: 48px;
            height: 48px;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .form-label {
            font-size: 0.75rem;
        }

        .form-control {
            padding: 9px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
        }

        .btn-gold {
            padding: 10px 20px;
            font-size: 0.85rem;
        }

        .auth-form .form-group {
            margin-bottom: 14px;
        }

        .auth-footer {
            font-size: 0.8rem;
            margin-top: 14px;
        }

        .form-text {
            font-size: 0.65rem;
        }
    }

    @media (max-width: 480px) {
        .auth-section {
            padding: 20px 0 30px;
            min-height: calc(100vh - 120px);
        }

        .auth-card {
            padding: 18px 14px;
            border-radius: 14px;
        }

        .auth-title {
            font-size: 1.1rem;
        }

        .auth-subtitle {
            font-size: 0.75rem;
        }

        .auth-icon {
            width: 40px;
            height: 40px;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .form-label {
            font-size: 0.7rem;
        }

        .form-control {
            padding: 8px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border-width: 1.5px;
        }

        .btn-gold {
            padding: 9px 16px;
            font-size: 0.8rem;
        }

        .auth-form .form-group {
            margin-bottom: 12px;
        }

        .auth-footer {
            font-size: 0.75rem;
            margin-top: 12px;
        }

        .auth-header {
            margin-bottom: 18px;
        }

        .form-text {
            font-size: 0.6rem;
        }
    }

    @media (max-width: 360px) {
        .auth-card {
            padding: 14px 10px;
            border-radius: 12px;
        }

        .auth-title {
            font-size: 1rem;
        }

        .form-control {
            padding: 6px 8px;
            font-size: 0.75rem;
        }

        .btn-gold {
            padding: 8px 14px;
            font-size: 0.75rem;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('.auth-form');
        const password = document.getElementById('password');
        const confirm = document.getElementById('confirm_password');

        form.addEventListener('submit', function(e) {
            let isValid = true;

            if (password.value.length < 6) {
                password.classList.add('is-invalid');
                isValid = false;
            } else {
                password.classList.remove('is-invalid');
            }

            if (password.value !== confirm.value) {
                confirm.classList.add('is-invalid');
                isValid = false;
            } else {
                confirm.classList.remove('is-invalid');
            }

            if (!isValid) {
                e.preventDefault();
                const firstInvalid = form.querySelector('.is-invalid');
                if (firstInvalid) {
                    firstInvalid.focus();
                    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });

        [password, confirm].forEach(input => {
            input.addEventListener('input', function() {
                this.classList.remove('is-invalid');
                if (this === confirm) {
                    if (password.value !== confirm.value) {
                        confirm.classList.add('is-invalid');
                    } else {
                        confirm.classList.remove('is-invalid');
                    }
                }
            });
        });
    });
</script>
{% endblock %}
